<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiWorldwide</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidomeny (Sidebar) */
    .sidebar {
      width: 260px;
      background-color: #171717;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid #424242;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .new-chat-btn:hover {
      background-color: #212121;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
    }

    /* Huvudområde */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #212121;
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      border-bottom: 1px solid #2f2f2f;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #b4b4b4;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .model-selector {
      font-weight: 600;
      font-size: 1.1rem;
      color: #ececec;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-selector span {
      font-size: 0.75rem;
      color: #10a37f;
      background: #1a2e28;
      border: 1px solid #10a37f;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Chattmeddelanden */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }

    .row {
      display: flex;
      justify-content: center;
      padding: 18px 16px;
      width: 100%;
    }

    .message-content {
      max-width: 768px;
      width: 100%;
      display: flex;
      gap: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .user .avatar { background-color: #5436da; color: white; }
    .ai .avatar { background-color: #10a37f; color: white; }

    .text-body {
      flex: 1;
      overflow-x: auto;
    }

    .text-body p { margin-bottom: 10px; }
    .text-body code {
      background: #2f2f2f;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Inmatning i botten */
    .input-container {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #chat-form {
      max-width: 768px;
      width: 100%;
      background: #2f2f2f;
      border-radius: 24px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      font-size: 1rem;
      padding: 8px 0;
    }

    #send-btn {
      background: #676767;
      color: #212121;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    #user-input:valid + #send-btn {
      background: #ffffff;
    }

    .disclaimer {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-top: 8px;
      text-align: center;
    }

    /* Mobilanpassning */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="new-chat-btn">+ Ny chatt</button>
    <div class="history-list" id="history-list"></div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <button class="menu-btn" id="menu-btn">☰</button>
      <div class="model-selector">AiWorldwide <span>Official</span></div>
    </header>

    <div class="chat-messages" id="chat-messages"></div>

    <footer class="input-container">
      <form id="chat-form">
        <input type="text" id="user-input" placeholder="Skriv ett meddelande till AiWorldwide..." autocomplete="off" required />
        <button type="submit" id="send-btn">➔</button>
      </form>
      <span class="disclaimer">AiWorldwide. Kontrollera viktig information.</span>
    </footer>
  </main>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const newChatBtn = document.getElementById('new-chat-btn');

    const responses = [
      "Välkommen till AiWorldwide! Hur kan jag hjälpa dig idag?",
      "### AiWorldwide\n1. Jag kan analysera och generera kod.\n2. Jag hjälper dig att skriva och redigera text.\n3. Snabba och exakta svar.",
      "Det är en mycket intressant fråga! Låt oss undersöka det närmare."
    ];

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      addMessageRow('DU', text, 'user');
      userInput.value = '';

      setTimeout(() => {
        const randomReply = responses[Math.floor(Math.random() * responses.length)];
        addMessageRow('AI', randomReply, 'ai');
      }, 800);
    });

    function addMessageRow(sender, text, type) {
      const row = document.createElement('div');
      row.classList.add('row', type);

      const content = document.createElement('div');
      content.classList.add('message-content');

      const avatar = document.createElement('div');
      avatar.classList.add('avatar');
      avatar.textContent = type === 'user' ? 'DU' : 'AI';

      const textBody = document.createElement('div');
      textBody.classList.add('text-body');
      textBody.innerHTML = window.marked ? marked.parse(text) : text;

      content.appendChild(avatar);
      content.appendChild(textBody);
      row.appendChild(content);

      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    newChatBtn.addEventListener('click', () => {
      chatMessages.innerHTML = '';
      addMessageRow('AI', 'Välkommen till AiWorldwide! Hur kan jag hjälpa dig idag?', 'ai');
      sidebar.classList.remove('open');
    });

    // Startmeddelande
    addMessageRow('AI', 'Välkommen till AiWorldwide! Hur kan jag hjälpa dig idag?', 'ai');
  </script>

</body>
</html>
